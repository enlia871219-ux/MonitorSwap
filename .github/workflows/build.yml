name: Build MonitorSwap

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build executable
        shell: cmd
        run: Build.bat
      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: MonitorSwap
          path: MonitorSwap.exe
          if-no-files-found: error
